name: Assemble original online HTML
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore and verify exact HTML bytes
        run: |
          cat index.html.part1 index.html.part2 > index.html
          echo "d117561af4c1221d4fbcae7e3e6387dbe890764e1b5c2f181648e7c2d215dd9b  index.html" | sha256sum -c -
          python3 - <<'PY'
          import csv, hashlib, pathlib
          rows = list(csv.DictReader(open("image_manifest.csv", encoding="utf-8-sig")))
          assert len(rows) == 147
          for row in rows:
              data = (pathlib.Path("images") / row["filename"]).read_bytes()
              assert len(data) == int(row["size_bytes"]), row["filename"]
              assert hashlib.sha256(data).hexdigest() == row["sha256"], row["filename"]
          print("Verified all 147 original images")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Publish byte-verified online HTML"
          git push
